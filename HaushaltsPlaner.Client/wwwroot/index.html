<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Haushaltsplaner</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HaushaltsPlaner.Client.styles.css" rel="stylesheet" />
    
    <!-- Mobile-optimized styles -->
    <style>
    /* Prevent tap highlight on mobile */
        * {
 -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        }
        
        /* Ensure buttons are touch-friendly */
        button, input[type="submit"] {
     touch-action: manipulation;
    -webkit-user-select: none;
          user-select: none;
        }
        
      /* Prevent iOS zoom on input focus */
        input, select, textarea {
            font-size: 16px !important;
     }
    </style>
</head>

<body>
    <div id="app">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div style="text-align: center; color: white;">
      <svg class="loading-progress" style="width: 80px; height: 80px;">
    <circle r="40%" cx="50%" cy="50%" />
             <circle r="40%" cx="50%" cy="50%" />
        </svg>
  <div style="margin-top: 20px; font-size: 18px; font-weight: 600;">Haushaltsplaner wird geladen...</div>
  </div>
        </div>
    </div>

    <div id="blazor-error-ui">
   Ein unerwarteter Fehler ist aufgetreten.
    <a href="" class="reload">Neu laden</a>
        <a class="dismiss">🗙</a>
  </div>
    
    <script>
        // Mobile-optimized helper functions
        window.mobileHelper = {
            // Safe navigation for mobile devices
            navigateTo: function(url) {
      try {
                    window.location.href = url;
      } catch (e) {
     console.error('Navigation error:', e);
     // Fallback
       setTimeout(() => window.location.href = url, 100);
      }
     },
  
          // Prevent double-tap zoom on buttons
         preventDoubleTapZoom: function() {
           let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
 const now = Date.now();
      if (now - lastTouchEnd <= 300) {
   event.preventDefault();
    }
          lastTouchEnd = now;
             }, { passive: false });
            },
            
            // Check if device is mobile
        isMobile: function() {
       return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}
 };
        
     // Initialize mobile optimizations
        if (window.mobileHelper.isMobile()) {
          window.mobileHelper.preventDoubleTapZoom();
         console.log('Mobile optimizations enabled');
        }
    </script>
    
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
