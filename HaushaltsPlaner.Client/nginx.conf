server {
    # 8080, not 80: the container runs as the unprivileged UID 101, which cannot bind a
    # port below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM: alle unbekannten Routen auf index.html
    location / {
        # Clickjacking protection: the app is never meant to be framed.
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }

    # API-Anfragen intern an den Server-Container weiterleiten
    location /api/ {
        proxy_pass         http://server:5242/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SignalR WebSocket intern weiterleiten
    location /chathub {
        proxy_pass         http://server:5242/chathub;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
